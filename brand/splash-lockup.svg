<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title">
  <title id="title">Framilton Chess</title>
  <rect width="1000" height="480" rx="40" fill="#0A1834"/>
  <circle cx="240" cy="240" r="130" fill="#1C64F2"/>
  <text x="240" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="190" font-weight="800" fill="#FFFFFF">F</text>
  <text x="430" y="215" font-family="system-ui,sans-serif" font-size="68" font-weight="800" letter-spacing="5" fill="#FFFFFF">FRAMILTON</text>
  <text x="430" y="300" font-family="system-ui,sans-serif" font-size="54" font-weight="650" fill="#FFFFFF">CHESS</text>
  <text x="430" y="355" font-family="system-ui,sans-serif" font-size="24" fill="#94A3B8">ENTIRELY ON YOUR DEVICE</text>
</svg>
